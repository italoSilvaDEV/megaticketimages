<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Marcelo Soares — Links</title>
  <meta name="description" content="Página de bio fictícia para demonstração do Leadble Concierge." />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at 20% 0%, rgba(124, 58, 237, .22), transparent 34%),
        radial-gradient(circle at 100% 20%, rgba(14, 165, 233, .14), transparent 30%),
        #0b0d12;
      display: grid;
      place-items: center;
      padding: 36px 18px;
    }
    .page { width: min(100%, 520px); }
    .profile { text-align: center; margin-bottom: 26px; }
    .avatar {
      width: 92px; height: 92px; margin: 0 auto 17px;
      border-radius: 50%; display: grid; place-items: center;
      font-weight: 800; font-size: 30px; letter-spacing: -1px;
      background: linear-gradient(135deg, #7c3aed, #0ea5e9);
      border: 3px solid rgba(255,255,255,.84);
      box-shadow: 0 18px 48px rgba(0,0,0,.36);
    }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.5px; }
    .handle { margin-top: 7px; color: #a7b0c0; font-size: 14px; }
    .bio { margin: 12px auto 0; max-width: 430px; color: #cbd5e1; line-height: 1.55; font-size: 15px; }
    .links { display: grid; gap: 12px; }
    .link, .chat-btn {
      width: 100%; min-height: 58px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      padding: 14px 18px; text-decoration: none;
      font: inherit; font-weight: 650; cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .link {
      color: #f8fafc; background: rgba(255,255,255,.065);
      border: 1px solid rgba(255,255,255,.11);
      backdrop-filter: blur(12px);
    }
    .link:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.095); }
    .chat-btn {
      border: 0; color: white; margin-top: 4px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      box-shadow: 0 12px 28px rgba(79,70,229,.28);
    }
    .chat-btn:hover { transform: translateY(-2px); }
    .chat-btn span { display: inline-flex; align-items: center; gap: 9px; }
    .chat-btn svg { width: 20px; height: 20px; }
    .foot { text-align: center; color: #667085; font-size: 12px; margin-top: 24px; }
    .status { min-height: 18px; text-align:center; font-size:12px; color:#94a3b8; margin-top:10px; }
  </style>
</head>
<body>
  <main class="page">
    <section class="profile">
      <div class="avatar" aria-hidden="true">MS</div>
      <h1>Marcelo Soares</h1>
      <div class="handle">@marcelosoares</div>
      <p class="bio">Empreendedor, criador e consultor digital. Estratégia, tecnologia e novos negócios.</p>
    </section>

    <nav class="links" aria-label="Links principais">
      <a class="link" href="#">Meu site</a>
      <a class="link" href="#">Conheça meus projetos</a>
      <a class="link" href="#">Instagram</a>
      <button class="chat-btn" id="open-chat" type="button">
        <span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 18.5 3.5 21l1-4.2A8 8 0 1 1 7 18.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          Abrir chat
        </span>
      </button>
    </nav>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="foot">Página demonstrativa · Leadble Concierge</div>
  </main>

  <script
    src="https://leadble.com.br/concierge.js"
    data-site="marcelo-soares"
    data-variant="bubble"
    async
  ></script>

  <script
    src="https://leadble.com.br/concierge.js"
    data-site="marcelo-soares"
    data-variant="balloon"
    async
  ></script>

  <script>
    const status = document.getElementById('status');

    function deepFindClickable(root = document) {
      const selectors = [
        '[data-leadble-open]', '[data-leadble]',
        '[aria-label*="chat" i]', '[title*="chat" i]',
        '[class*="leadble" i] button', '[id*="leadble" i] button',
        'button[class*="chat" i]', 'button[id*="chat" i]'
      ];
      for (const selector of selectors) {
        const el = root.querySelector?.(selector);
        if (el && el.id !== 'open-chat') return el;
      }
      for (const el of root.querySelectorAll?.('*') || []) {
        if (el.shadowRoot) {
          const found = deepFindClickable(el.shadowRoot);
          if (found) return found;
        }
      }
      return null;
    }

    document.getElementById('open-chat').addEventListener('click', () => {
      const target = deepFindClickable();
      if (target) {
        target.click();
        status.textContent = '';
        return;
      }
      window.dispatchEvent(new CustomEvent('leadble:open', { detail: { site: 'marcelo-soares', variant: 'bubble' } }));
      document.dispatchEvent(new CustomEvent('leadble:open', { detail: { site: 'marcelo-soares', variant: 'bubble' } }));
      window.postMessage({ type: 'leadble:open', site: 'marcelo-soares', variant: 'bubble' }, '*');
      status.textContent = 'Chat solicitado.';
      setTimeout(() => status.textContent = '', 1800);
    });
  </script>
</body>
</html>
